<!--
  Storybook renders stories in its own iframe (iframe.html), which has its
  own <head> — separate from the app's index.html. The Space Grotesk Google
  Fonts link lives there, so without this file Storybook falls back to the
  next font in the stack instead of loading it. This file is Storybook's
  documented mechanism for injecting extra <head> tags into that iframe.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
